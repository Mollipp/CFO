# The HUD stylesheet paints the app shell, cards and charts, but leaves
# Streamlit's own widgets (dataframes, selects, sliders) to the base theme.
# Dark base is what keeps those consistent with the cockpit.
[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#080a08"
primaryColor = "#13ac33"
textColor = "#e6f5e9"

[client]
toolbarMode = "minimal"
